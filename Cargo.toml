[package]
name = "lark_alert"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Production-ready Feishu/Lark custom bot notification library with Python bindings"
license = "MIT"
repository = "https://github.com/Ye-Yu-Mo/lark_alert"
readme = "README.md"
keywords = ["feishu", "lark", "webhook", "notification", "alert"]
categories = ["web-programming", "api-bindings"]

[lib]
name = "lark_alert"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
hmac = "=0.12.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
ureq = { version = "=3.1.2", default-features = false, features = ["rustls", "json"] }
url = "=2.5.8"

[dev-dependencies]

[features]
default = []
python = ["dep:pyo3"]

[dependencies.pyo3]
version = "=0.29.2"
optional = true
