[package]
name = "lark_alert"
version = "0.1.0"
edition = "2024"
description = "Production-ready Feishu/Lark custom bot notification library with Python bindings"
license = "MIT"

[lib]
name = "lark_alert"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"

[dev-dependencies]
# No external dev-dependencies are required; tests use std TcpListener.

[features]
default = []
python = ["dep:pyo3"]

[dependencies.pyo3]
version = "0.29"
optional = true
features = ["extension-module"]

[profile.release]
lto = true
strip = true
